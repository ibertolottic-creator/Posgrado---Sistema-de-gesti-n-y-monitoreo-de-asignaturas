<!-- ==================== JS START: MÓDULO DE RESULTADOS GENERALES ==================== -->
<script>
  var dtResultadosInstance = null;
  var isLoadingResultados = false;
  var CURRENT_RESULTADOS_DATA = [];
  var CURRENT_SHEET_URL = '';

  // Fallback nativo: Si showToast no está definido globalmente, usa un alert() para que el código jamás colapse.
  window.showToast = window.showToast || function(title, msg, type) {
     alert("[" + title.toUpperCase() + "]\n" + msg);
  };

  /**
   * @description Inicializador al cargar el módulo RESULTADOS
   */
  function initResultadosModule() {
    if (dtResultadosInstance) {
      // Si ya existe la vista, simplemente refrescamos los datos sin forzar Sincronización
      fetchResultados(false);
    } else {
      // Primera vez: Forzamos sincronización para tener lo más fresco posible
      fetchResultados(true);
    }
  }

  /**
   * @description Llama al backend (Google Apps Script) para sincronizar (opcional) y traer la data.
   * @param {boolean} forceSync Si es true, activa la función sincronizarResultadosGenerales en backend.
   */
  function fetchResultados(forceSync = false) {
    if (isLoadingResultados) return;

    isLoadingResultados = true;

    // Bloquear UI
    document.getElementById('resultados-table-container').classList.add('hidden');
    document.getElementById('resultados-empty-state').classList.add('hidden');
    document.getElementById('btnEnviarCorreos').disabled = true;
    document.getElementById('btnEnviarCorreos').classList.add('opacity-50', 'cursor-not-allowed');

    const loader = document.getElementById('resultados-loader');
    const iconSync = document.getElementById('iconSyncResultados');

    loader.classList.remove('hidden');
    iconSync.classList.add('fa-spin');

    if (forceSync) {
      document.getElementById('resultados-loader-title').innerText = 'Forzando Sincronización...';
      document.getElementById('resultados-loader-msg').innerText =
        'Ejecutando LockService. Cruzando notas de Virtual, Presencial y Acompañamiento.';
    } else {
      document.getElementById('resultados-loader-title').innerText = 'Cargando Resultados...';
      document.getElementById('resultados-loader-msg').innerText =
        'Descargando la última instantánea disponible.';
    }

    google.script.run
      .withSuccessHandler((res) => {
        isLoadingResultados = false;
        loader.classList.add('hidden');
        iconSync.classList.remove('fa-spin');

        if (res.success) {
          if (res.userEmail) {
            document.getElementById('resultados-user-email').innerText = res.userEmail;
          }
          if (res.sheetUrl) {
            CURRENT_SHEET_URL = res.sheetUrl;
          }
          CURRENT_RESULTADOS_DATA = res.data || [];
          renderResultadosTable(res.data);
        } else {
          if (res.retryLater) {
            showToast('Sistema Ocupado', res.message, 'warning');
            document.getElementById('resultados-empty-state').classList.remove('hidden');
          } else {
            showToast('Error', res.message, 'error');
            document.getElementById('resultados-empty-state').classList.remove('hidden');
          }
        }
      })
      .withFailureHandler((err) => {
        isLoadingResultados = false;
        loader.classList.add('hidden');
        iconSync.classList.remove('fa-spin');
        showToast('Error de Conexión', err.toString(), 'error');
        document.getElementById('resultados-empty-state').classList.remove('hidden');
      })
      // Llamamos a la función en GeneradorResultados.gs
      // Si forceSync es true, ejecuta sincronizarResultadosGenerales interno.
      .getConsolidatedData(forceSync);
  }

  /**
   * @description Renderiza el array de resultados en DataTables.
   */
  function renderResultadosTable(dataArray) {
    const container = document.getElementById('resultados-table-container');
    const emptyState = document.getElementById('resultados-empty-state');
    const btnCorreos = document.getElementById('btnEnviarCorreos');

    CURRENT_RESULTADOS_DATA = dataArray || [];

    if (!dataArray || dataArray.length === 0) {
      container.classList.remove('hidden');
      emptyState.classList.remove('hidden');
      document.getElementById('dtResultados').parentElement.classList.add('hidden'); // Ocultar div de tabla
      document.getElementById('infoResultadosCount').innerText = '0 registros';
      return;
    }

    // Destruir instancia anterior si existe (para limpiar memoria)
    if (dtResultadosInstance) {
      // Limpiar los filtros inyectados en la cabecera para evitar que DataTables se contamine
      document.querySelectorAll('.dt-custom-filter').forEach(function(el) { el.remove(); });
      dtResultadosInstance.destroy();
      dtResultadosInstance = null;
    }

    const tbody = document.getElementById('tblResultadosBody');
    tbody.innerHTML = '';

    let seleccionablesStr = [];

    dataArray.forEach((row) => {
      // Badge para Nivel
      let badgeColor = 'bg-gray-100 text-gray-800';
      if (row.nivel === 'Muy Bueno') badgeColor = 'bg-green-100 text-green-800';
      else if (row.nivel === 'Bueno') badgeColor = 'bg-blue-100 text-blue-800';
      else if (row.nivel === 'Regular') badgeColor = 'bg-yellow-100 text-yellow-800';
      else if (row.nivel === 'Deficiente' || row.nivel === 'Bajo')
        badgeColor = 'bg-red-100 text-red-800';

      // Validar Estado Envío
      let estadoEnvioBadge = '-';
      let yaEnviado = false;
      if (row.fechaEnvio && String(row.fechaEnvio).trim() !== '') {
        yaEnviado = true;
        estadoEnvioBadge = `<span class="inline-flex items-center px-2 py-0.5 rounded textxs font-medium bg-green-100 text-green-800" title="Enviado el ${row.fechaEnvio}"><i class="fa-solid fa-check-double mr-1"></i>Enviado</span>`;
      } else {
        estadoEnvioBadge = `<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-yellow-100 text-yellow-800"><i class="fa-regular fa-clock mr-1"></i>Pendiente</span>`;
      }

      // Validar Condiciones de Habilitación para Enviar (100% en LMS y Acomp + URLs existen + No enviado aún)
      const esCienPorCiento =
        parseFloat(row.lmsAvance) === 100 && parseFloat(row.acompAvance) === 100;
      const tieneURLs = row.lmsUrl && row.lmsUrl !== '' && row.acompUrl && row.acompUrl !== '';
      const esMio =
        (window.AUTH_DATA &&
          row.coordinadorName &&
          window.AUTH_DATA.name === row.coordinadorName) ||
        (document.getElementById('resultados-user-email') &&
          row.coordinadorEmail === document.getElementById('resultados-user-email').innerText);
      // Ya que el userEmail no viajará directamente aqui, usaremos un truco visual o lo dejabamos marcado

      let isDisabled = !(esCienPorCiento && tieneURLs && !yaEnviado);
      let isChecked = !isDisabled; // Se marca por defecto si cumple todo

      if (isChecked) seleccionablesStr.push(row.id);

      let checkboxHtml = `<input type="checkbox" onchange="actualizarBotonesResultados()" class="chk-resultado w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed" value="${row.id}" ${isChecked ? 'checked' : ''} ${isDisabled ? 'disabled' : ''}>`;

      // Enlaces a fichas
      let linkLmsHtml = row.lmsUrl
        ? `<a href="${row.lmsUrl}" target="_blank" class="text-blue-600 hover:text-blue-800" title="Ver Ficha LMS"><i class="fa-solid fa-file-pdf text-lg"></i></a>`
        : `<span class="text-gray-300">-</span>`;
      let linkAcompHtml = row.acompUrl
        ? `<a href="${row.acompUrl}" target="_blank" class="text-purple-600 hover:text-purple-800" title="Ver Ficha Acompañamiento"><i class="fa-solid fa-file-pdf text-lg"></i></a>`
        : `<span class="text-gray-300">-</span>`;

      // Renderizador de Badges de Avance con Colores Pastel
      const getAvanceBadge = (val) => {
        let badgeClass = 'text-gray-500 bg-gray-100';
        if (val <= 10) badgeClass = 'bg-pink-100 text-pink-700 font-medium';
        else if (val <= 30) badgeClass = 'bg-orange-100 text-orange-700 font-medium';
        else if (val <= 60) badgeClass = 'bg-yellow-100 text-yellow-800 font-medium';
        else if (val < 100) badgeClass = 'bg-blue-100 text-blue-700 font-medium';
        else badgeClass = 'bg-green-100 text-green-700 font-bold';

        return `<span class="inline-block px-2 py-1 min-w-[3rem] text-center rounded-full text-xs ${badgeClass}">${val.toFixed(0)}%</span>`;
      };

      // Renderizador de Badges "A Mejorar"
      const getMejorarBadges = (str) => {
        if (!str || str.trim() === '') return `<span class="text-gray-300">-</span>`;
        const arr = str
          .split(',')
          .map((item) => item.trim())
          .filter((item) => item !== '');
        if (arr.length === 0) return `<span class="text-gray-300">-</span>`;

        return arr
          .map(
            (crit) =>
              `<span class="inline-block bg-red-100 text-red-700 text-[10px] font-semibold px-1.5 py-0.5 rounded border border-red-200 mr-1 mb-1" title="Criterio a mejorar">${crit}</span>`
          )
          .join('');
      };

      // Porcentaje Avance LMS
      let lmsAvanceHtml = '-';
      let lmsMejorarHtml = getMejorarBadges(row.lmsMejorar);
      if (row.lmsAvance !== undefined && row.lmsAvance !== '') {
        lmsAvanceHtml = getAvanceBadge(parseFloat(row.lmsAvance));
      }

      // Porcentaje Avance Acomp
      let acompAvanceHtml = '-';
      let acompMejorarHtml = getMejorarBadges(row.acompMejorar);
      if (row.acompAvance !== undefined && row.acompAvance !== '') {
        acompAvanceHtml = getAvanceBadge(parseFloat(row.acompAvance));
      }

      // Celdas
      const tr = document.createElement('tr');
      tr.className = 'hover:bg-gray-50 transition-colors';
      tr.innerHTML = `
                <td class="px-4 py-3 sticky left-0 bg-white group-hover:bg-gray-50 border-r border-gray-200 z-10 text-center shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)]">
                    ${checkboxHtml}
                </td>
                <td class="px-4 py-3 bg-white font-medium text-gray-800" style="min-width: 250px; white-space: normal;" title="${row.curso}">${row.curso || '-'}</td>
                <td class="px-4 py-3" style="min-width: 150px; white-space: normal;" title="${row.programa}">${row.programa || '-'}</td>
                <td class="px-4 py-3" style="min-width: 200px; white-space: normal;" title="${row.docente}">${row.docente || '-'}</td>
                <td class="px-4 py-3 border-l border-gray-100 text-center">
                    ${estadoEnvioBadge}<br><span class="text-[10px] text-gray-400 mt-1 inline-block">${row.fechaEnvio || ''}</span>
                    ${isDisabled ? '' : `<br><button onclick="enviarCorreoIndividual('${row.id}')" class="mt-2 text-xs text-white bg-blue-600 hover:bg-blue-700 px-2 py-1 rounded shadow-sm transition-colors" title="Enviar ficha a este docente"><i class="fa-solid fa-paper-plane mr-1"></i>Enviar Único</button>`}
                </td>
                <td class="px-4 py-3 text-gray-500 text-xs truncate" style="max-width:150px;" title="${row.coordinadorName}">${row.coordinadorName || '-'}</td>
                
                <td class="px-4 py-3 border-l border-blue-100 text-blue-900 font-medium">${row.lmsScore !== '' ? row.lmsScore : '-'}</td>
                <td class="px-4 py-3 border-l border-blue-50 text-blue-900 font-bold">${(row.lmsVigesimal !== '' && row.lmsVigesimal !== null && row.lmsVigesimal !== undefined && !isNaN(row.lmsVigesimal)) ? parseFloat(row.lmsVigesimal).toFixed(2) : '-'}</td>
                <td class="px-4 py-3 border-l border-blue-50 text-center bg-blue-50/10">${lmsAvanceHtml}</td>
                <td class="px-4 py-3 border-l border-blue-50 text-left" style="min-width: 120px; max-width: 250px; white-space: normal;">${lmsMejorarHtml}</td>
                <td class="px-4 py-3 border-l border-blue-50 text-center">${linkLmsHtml}</td>

                <td class="px-4 py-3 border-l border-purple-100 text-purple-900 font-medium">${row.acompScore !== '' ? row.acompScore : '-'}</td>
                <td class="px-4 py-3 border-l border-purple-50 text-purple-900 font-bold">${(row.acompVigesimal !== '' && row.acompVigesimal !== null && row.acompVigesimal !== undefined && !isNaN(row.acompVigesimal)) ? parseFloat(row.acompVigesimal).toFixed(2) : '-'}</td>
                <td class="px-4 py-3 border-l border-purple-50 text-center bg-purple-50/10">${acompAvanceHtml}</td>
                <td class="px-4 py-3 border-l border-purple-50 text-left" style="min-width: 120px; max-width: 250px; white-space: normal;">${acompMejorarHtml}</td>
                <td class="px-4 py-3 border-l border-purple-50 text-center">${linkAcompHtml}</td>

                <td class="px-4 py-3 border-l border-green-100 text-green-700 font-bold bg-green-50/10">${(row.centesimal !== '' && row.centesimal !== null && row.centesimal !== undefined && !isNaN(row.centesimal)) ? parseFloat(row.centesimal).toFixed(2) : '-'}</td>
                <td class="px-4 py-3 text-green-900 font-extrabold bg-green-50/10">${(row.vigesimal !== '' && row.vigesimal !== null && row.vigesimal !== undefined && !isNaN(row.vigesimal)) ? parseFloat(row.vigesimal).toFixed(2) : '-'}</td>
                <td class="px-4 py-3 bg-green-50/10">
                    ${row.nivel ? `<span class="px-2 py-1 rounded-full text-xs font-semibold ${badgeColor}">${row.nivel}</span>` : '<span class="text-gray-300">-</span>'}
                </td>
            `;
      tbody.appendChild(tr);
    });

    // Configurar botón "Seleccionar Todo" en cabecera
    const chkGlobal = document.getElementById('chkGlobalResultados');
    if (chkGlobal) {
      chkGlobal.checked = seleccionablesStr.length > 0;
      chkGlobal.disabled = seleccionablesStr.length === 0;
      chkGlobal.onclick = function () {
        // En DataTables si hay paginación, usar la API para afectar a todos
        if (dtResultadosInstance) {
          dtResultadosInstance.$('.chk-resultado:not(:disabled)').prop('checked', chkGlobal.checked);
        } else {
          const boxes = document.querySelectorAll('.chk-resultado:not(:disabled)');
          boxes.forEach((b) => (b.checked = chkGlobal.checked));
        }
        actualizarBotonesResultados();
      };
    }

    document.getElementById('dtResultados').parentElement.classList.remove('hidden');
    container.classList.remove('hidden');
    emptyState.classList.add('hidden');

    document.getElementById('infoResultadosCount').innerText =
      `${dataArray.length} registros cargados`;

    // Inicializar DataTable Nativo
    dtResultadosInstance = new DataTable('#dtResultados', {
      language: { url: 'https://cdn.datatables.net/plug-ins/1.13.7/i18n/es-ES.json' },
      pageLength: 25,
      ordering: true,
      info: true,
      searching: true,
      responsive: false,
      // Deshabilitamos scrollX nativo de DataTables para evitar que divida la tabla y cause desfase en zoom/pantallas anchas.
      // El scroll lo controla el contenedor div.overflow-x-auto con clases CSS tailwind 'sticky'.
      dom: '<"flex flex-col md:flex-row justify-between items-center mb-4"lf>rt<"flex flex-col md:flex-row justify-between items-center mt-4"ip>',
      initComplete: function () {
        var api = this.api();
        try {
            // Función Inteligente: Actualiza las opciones de los selects basándose en lo que está visible
            var redrawOptions = function() {
                api.columns([2, 3, 5]).every(function() {
                    var col = this;
                    var select = col.header().querySelector('select');
                    if (!select) return;
                    
                    // Si este select tiene filtro activo, no borramos sus hermanos para permitir que deshaga el filtro.
                    if (select.value !== "") return;

                    var oldVal = select.value;
                    select.options.length = 1; // Vaciar dejando solo 'Todos'

                    // Obtener opciones únicas SOLO de filas filtradas/actuas
                    var uniqueData = col.data({search: 'applied'}).unique().sort();
                    
                    for (var i = 0; i < uniqueData.length; i++) {
                        var d = uniqueData[i];
                        var val = d ? d.toString().replace(/(<([^>]+)>)/gi, "").trim() : "";
                        if (val !== '' && val !== '-') {
                            var optionExists = Array.from(select.options).some(function(o) { return o.value === val; });
                            if (!optionExists) {
                                select.add(new Option(val.substring(0, 45) + (val.length > 45 ? '...' : ''), val));
                            }
                        }
                    }
                    select.value = oldVal;
                });
            };

            // Búsqueda por columna en cabeceras principales
            api.columns([1, 2, 3, 5]).every(function () {
              var column = this;
              var header = column.header(); // nativo DOM
              var colIdx = column.index();

              if (!header) return;

              if (colIdx === 1) {
                var input = document.createElement('input');
                input.type = 'text';
                input.className = 'dt-custom-filter w-full mt-2 px-2 py-1 text-xs border border-gray-300 rounded font-normal text-gray-700 bg-white focus:outline-none focus:ring-1 focus:ring-blue-500';
                input.placeholder = '🔍 Buscar Asignatura...';
                
                input.addEventListener('keyup', function(e) {
                    e.stopPropagation();
                    if (column.search() !== this.value) {
                      column.search(this.value).draw();
                    }
                });
                
                input.addEventListener('change', function(e) {
                    e.stopPropagation();
                    if (column.search() !== this.value) {
                      column.search(this.value).draw();
                    }
                });
                
                input.addEventListener('click', function(e) { e.stopPropagation(); });
                header.appendChild(input);
              } else {
                var select = document.createElement('select');
                select.className = 'dt-custom-filter w-full mt-2 px-1 py-1 text-xs border border-gray-300 rounded font-normal text-gray-700 bg-white focus:outline-none focus:ring-1 focus:ring-blue-500 appearance-none';
                select.add(new Option('Todos', ''));
                
                var uniqueData = column.data().unique().sort();
                for (var i = 0; i < uniqueData.length; i++) {
                    var d = uniqueData[i];
                    var val = d ? d.toString().replace(/(<([^>]+)>)/gi, "").trim() : "";
                    if (val !== '' && val !== '-') {
                        var optionExists = Array.from(select.options).some(function(o) { return o.value === val; });
                        if (!optionExists) {
                            select.add(new Option(val.substring(0, 45) + (val.length > 45 ? '...' : ''), val));
                        }
                    }
                }
                
                select.addEventListener('change', function(e) {
                    e.stopPropagation();
                    var val = this.value;
                    var searchRegex = val ? "^" + val.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + "$" : "";
                    column.search(searchRegex, true, false).draw();
                });
                
                select.addEventListener('click', function(e) { e.stopPropagation(); });
                header.appendChild(select);
              }
            });

            // Registrar oyente de evento de reactualización DataTables
            api.on('draw.dt', redrawOptions);

        } catch (error) {
            console.error("Error al inyectar filtros personalizados DataTables:", error);
        }
      }
    });
    
    // Evaluar el estado del botón masivo recién instanciada la tabla
    actualizarBotonesResultados();
  }

  /**
   * @description Analiza cuántos Checkbox están marcados en TODA la tabla
   * y habilita o deshabilita el botón de Envío Masivo.
   */
  function actualizarBotonesResultados() {
     const btnCorreos = document.getElementById('btnEnviarCorreos');
     let checkedCount = 0;
     
     if (dtResultadosInstance) {
        checkedCount = dtResultadosInstance.$('.chk-resultado:checked').length;
     } else {
        checkedCount = document.querySelectorAll('.chk-resultado:checked').length;
     }
     
     if (checkedCount > 0) {
        btnCorreos.disabled = false;
        btnCorreos.classList.remove('opacity-50', 'cursor-not-allowed');
     } else {
        btnCorreos.disabled = true;
        btnCorreos.classList.add('opacity-50', 'cursor-not-allowed');
     }
  }

  /**
   * @description Botón de Ejecución de Correo Individual
   */
  function enviarCorreoIndividual(idRegistro) {
    if (!idRegistro) return;
    
    if (confirm('¿Enviar Ficha Individual?\n\nSe exportarán las fichas PDF y se enviarán automáticamente a los correos del docente.')) {
      showToast('Procesando Envío', 'Exportando PDFs desde Drive y conectando con el servidor MS...', 'info', 7000);
        
        google.script.run
          .withSuccessHandler((response) => {
            if (response.success) {
              if (response.message && response.message.trim() !== '') {
                showToast('Enviado con Observaciones', 'Ficha remitida, pero hubieron problemas:\n' + response.message, 'warning', 8000);
              } else {
                showToast('Notificación Enviada', 'La ficha fue remitida al correo exitosamente.', 'success', 5000);
              }
              fetchResultados(false);
            } else {
              showToast('Error', response.message, 'error');
            }
          })
          .withFailureHandler((error) => {
            showToast('Error de Conexión', error.toString(), 'error');
          })
          // Reutilizamos el backend enviando un Array de 1 solo elemento
          .enviarCorreosResultadosMasivos([String(idRegistro)]);
    }
  }

  /**
   * @description Botón de Ejecución de Correspondencia Masiva
   */
  function openCorreoModalMasivo() {
    let ids = [];
    if (dtResultadosInstance) {
      // Usamos el API de DataTables para ignorar la paginación visual y capturar todas
      const boxes = dtResultadosInstance.$('.chk-resultado:checked');
      for(let i=0; i<boxes.length; i++) ids.push(boxes[i].value);
    } else {
      const boxes = document.querySelectorAll('.chk-resultado:checked');
      ids = Array.from(boxes).map((b) => b.value);
    }

    if (ids.length === 0) {
      showToast(
        'Sin Selección',
        'No ha seleccionado ninguna asignatura hábil para envío.',
        'warning'
      );
      return;
    }

    if (confirm(`¿Enviar ${ids.length} correos?\n\nSe remitirán automáticamente los reportes consolidados (Centesimal y Vigesimal) con sus respectivos adjuntos a los docentes seleccionados.`)) {
        // Estado Loading Visual
        const btn = document.getElementById('btnEnviarCorreos');
        const btnOriginalHTML = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>Enviando...';
        btn.disabled = true;

        showToast(
          'Enviando Correos',
          `Procesando ${ids.length} correos mediante el servidor. Por favor espere.`,
          'info',
          6000
        );

        google.script.run
          .withSuccessHandler((response) => {
            btn.innerHTML = btnOriginalHTML;
            btn.disabled = false;

            if (response.success) {
              if (response.message && response.message.trim() !== '') {
                 showToast(
                  'Envíos con Observaciones',
                  `Se enviaron ${response.count} correos.\nDetalles: ${response.message}`,
                  'warning',
                  8000
                );
              } else {
                 showToast(
                  'Envíos Exitosos',
                  `Se despacharon exitosamente ${response.count} correos institucionales.`,
                  'success',
                  5000
                );
              }
              // Refrescar tabla forzosamente para ver fechas insertadas
              fetchResultados(false);
            } else {
              showToast('Error', response.message, 'error');
            }
          })
          .withFailureHandler((error) => {
            btn.innerHTML = btnOriginalHTML;
            btn.disabled = false;
            showToast('Error de Conexión', error.toString(), 'error');
          })
          .enviarCorreosResultadosMasivos(ids);
    }
  }

  /**
   * @description Abre la hoja de Google Sheets en la pestaña de Envío de Resultados
   */
  function abrirHojaGoogleSheetsResultados() {
    if (CURRENT_SHEET_URL && CURRENT_SHEET_URL.trim() !== '') {
      window.open(CURRENT_SHEET_URL, '_blank');
    } else {
      showToast("Abriendo Sheets", "Obteniendo enlace de la hoja institucional...", "info");
      google.script.run
        .withSuccessHandler((res) => {
          if (res && res.sheetUrl) {
            CURRENT_SHEET_URL = res.sheetUrl;
            window.open(res.sheetUrl, '_blank');
          } else {
            showToast("Aviso", "Por favor actualice los datos primero.", "warning");
          }
        })
        .withFailureHandler((err) => {
          showToast("Error", "No se pudo obtener el enlace: " + err.toString(), "error");
        })
        .getConsolidatedData(false);
    }
  }

  /**
   * @description Genera y descarga el PDF de toda la Matriz Consolidada con diseño institucional en alta resolución
   */
  function exportarPdfMatrizConsolidada() {
    if (!CURRENT_RESULTADOS_DATA || CURRENT_RESULTADOS_DATA.length === 0) {
      showToast("Sin Datos", "No hay datos consolidados para exportar.", "warning");
      return;
    }

    if (typeof html2pdf === 'undefined') {
      showToast("Dependencia Faltante", "La librería de exportación PDF no está disponible.", "error");
      return;
    }

    showToast("Generando PDF", "Preparando reporte de toda la Matriz Consolidada...", "info");

    const btn = document.getElementById('btnExportarPdfResultados');
    const originalHTML = btn ? btn.innerHTML : '';
    if (btn) {
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1.5"></i>Generando...';
      btn.disabled = true;
    }

    // Exportar todos los datos cargados en memoria
    let dataToExport = CURRENT_RESULTADOS_DATA;

    // Crear contenedor temporal para el PDF
    const pdfWrapper = document.createElement('div');
    pdfWrapper.style.padding = '18px 22px';
    pdfWrapper.style.fontFamily = "'Inter', 'Segoe UI', Arial, sans-serif";
    pdfWrapper.style.color = '#1e293b';
    pdfWrapper.style.backgroundColor = '#ffffff';
    pdfWrapper.style.width = '100%';

    const nowStr = new Date().toLocaleString('es-PE', { dateStyle: 'medium', timeStyle: 'short' });

    // Cabecera institucional
    let html = `
      <div style="border-bottom: 2px solid #b91c1c; padding-bottom: 10px; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: flex-start;">
        <div>
          <div style="font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; color: #b91c1c; margin-bottom: 2px;">
            Universidad de San Martín de Porres — USMP Virtual
          </div>
          <h1 style="font-size: 17px; font-weight: 800; color: #0f172a; margin: 0; line-height: 1.2;">
            Matriz Consolidada de Resultados de Monitoreo Docente
          </h1>
          <p style="font-size: 10px; color: #64748b; margin: 3px 0 0 0;">
            Consolidación integral de Gestión del Aprendizaje (LMS) y Acompañamiento Pedagógico
          </p>
        </div>
        <div style="text-align: right; font-size: 9px; color: #475569;">
          <div style="font-weight: 700; color: #0f172a;">Fecha de Emisión:</div>
          <div>${nowStr}</div>
          <div style="margin-top: 3px; display: inline-block; background: #f1f5f9; padding: 2px 8px; border-radius: 6px; font-weight: 700; color: #1e293b;">
            Total Asignaturas: ${dataToExport.length}
          </div>
        </div>
      </div>

      <table style="width: 100%; border-collapse: collapse; font-size: 8.5px; margin-top: 6px;">
        <thead>
          <tr style="background: #f8fafc; border-top: 1px solid #cbd5e1; border-bottom: 1px solid #cbd5e1; text-transform: uppercase; font-size: 7.5px; color: #475569;">
            <th style="padding: 5px 3px; text-align: center; width: 22px;">N°</th>
            <th style="padding: 5px 4px; text-align: left;">Asignatura</th>
            <th style="padding: 5px 4px; text-align: left;">Programa</th>
            <th style="padding: 5px 4px; text-align: left;">Docente</th>
            <th style="padding: 5px 4px; text-align: left;">Coordinador</th>
            <th style="padding: 5px 3px; text-align: center; background: #eff6ff; color: #1e40af;">Ptje LMS</th>
            <th style="padding: 5px 3px; text-align: center; background: #eff6ff; color: #1e40af; font-weight: 800;">Vig. LMS</th>
            <th style="padding: 5px 3px; text-align: center; background: #eff6ff; color: #1e40af;">% LMS</th>
            <th style="padding: 5px 3px; text-align: center; background: #faf5ff; color: #6b21a8;">Ptje Acp</th>
            <th style="padding: 5px 3px; text-align: center; background: #faf5ff; color: #6b21a8; font-weight: 800;">Vig. Acp</th>
            <th style="padding: 5px 3px; text-align: center; background: #faf5ff; color: #6b21a8;">% Acp</th>
            <th style="padding: 5px 3px; text-align: center; background: #f0fdf4; color: #166534; font-weight: 800;">Centesimal</th>
            <th style="padding: 5px 3px; text-align: center; background: #f0fdf4; color: #166534; font-weight: 800;">Vigesimal</th>
            <th style="padding: 5px 3px; text-align: center; background: #f0fdf4; color: #166534; font-weight: 800;">Nivel</th>
            <th style="padding: 5px 3px; text-align: center;">Estado</th>
          </tr>
        </thead>
        <tbody>
    `;

    dataToExport.forEach((r, idx) => {
      const bgRow = idx % 2 === 0 ? '#ffffff' : '#f8fafc';
      const formatVal = (v) => (v !== '' && v !== null && v !== undefined && !isNaN(v)) ? parseFloat(v).toFixed(2) : '-';

      let nivelColor = '#64748b';
      let nivelBg = '#f1f5f9';
      if (r.nivel === 'Muy Bueno') { nivelColor = '#15803d'; nivelBg = '#dcfce7'; }
      else if (r.nivel === 'Bueno') { nivelColor = '#1d4ed8'; nivelBg = '#dbeafe'; }
      else if (r.nivel === 'Regular') { nivelColor = '#b45309'; nivelBg = '#fef3c7'; }
      else if (r.nivel === 'Deficiente' || r.nivel === 'Bajo') { nivelColor = '#b91c1c'; nivelBg = '#fee2e2'; }

      const estadoText = r.fechaEnvio && r.fechaEnvio.trim() !== '' ? 'Enviado' : 'Pendiente';
      const estadoColor = r.fechaEnvio && r.fechaEnvio.trim() !== '' ? '#15803d' : '#b45309';

      html += `
        <tr style="background: ${bgRow}; border-bottom: 1px solid #e2e8f0; page-break-inside: avoid;">
          <td style="padding: 4px 3px; text-align: center; color: #64748b; font-weight: 600;">${idx + 1}</td>
          <td style="padding: 4px 4px; font-weight: 600; color: #0f172a; max-width: 170px;">${r.curso || '-'}</td>
          <td style="padding: 4px 4px; color: #475569; max-width: 100px;">${r.programa || '-'}</td>
          <td style="padding: 4px 4px; color: #334155; max-width: 130px;">${r.docente || '-'}</td>
          <td style="padding: 4px 4px; color: #64748b; font-size: 7.5px;">${r.coordinadorName || '-'}</td>
          <td style="padding: 4px 3px; text-align: center; background: #f8fafc; color: #1e40af;">${r.lmsScore !== '' ? r.lmsScore : '-'}</td>
          <td style="padding: 4px 3px; text-align: center; background: #f8fafc; font-weight: 700; color: #1e40af;">${formatVal(r.lmsVigesimal)}</td>
          <td style="padding: 4px 3px; text-align: center; background: #f8fafc; color: #475569;">${r.lmsAvance !== '' ? Math.round(r.lmsAvance) + '%' : '-'}</td>
          <td style="padding: 4px 3px; text-align: center; background: #faf5ff; color: #6b21a8;">${r.acompScore !== '' ? r.acompScore : '-'}</td>
          <td style="padding: 4px 3px; text-align: center; background: #faf5ff; font-weight: 700; color: #6b21a8;">${formatVal(r.acompVigesimal)}</td>
          <td style="padding: 4px 3px; text-align: center; background: #faf5ff; color: #475569;">${r.acompAvance !== '' ? Math.round(r.acompAvance) + '%' : '-'}</td>
          <td style="padding: 4px 3px; text-align: center; background: #f0fdf4; font-weight: 700; color: #166534;">${formatVal(r.centesimal)}</td>
          <td style="padding: 4px 3px; text-align: center; background: #f0fdf4; font-weight: 800; color: #166534; font-size: 9.5px;">${formatVal(r.vigesimal)}</td>
          <td style="padding: 4px 3px; text-align: center; background: #f0fdf4;">
            <span style="display: inline-block; padding: 1.5px 5px; border-radius: 8px; font-size: 7.5px; font-weight: 700; background: ${nivelBg}; color: ${nivelColor};">
              ${r.nivel || '-'}
            </span>
          </td>
          <td style="padding: 4px 3px; text-align: center; font-size: 7.5px; font-weight: 600; color: ${estadoColor};">
            ${estadoText}
          </td>
        </tr>
      `;
    });

    html += `
        </tbody>
      </table>
      <div style="margin-top: 12px; padding-top: 6px; border-top: 1px solid #e2e8f0; display: flex; justify-content: space-between; font-size: 7.5px; color: #94a3b8;">
        <div>Sistema de Monitoreo del Cumplimiento de Estándares de Calidad Docente</div>
        <div>Documento Oficial Generado Digitalmente por USMP Virtual</div>
      </div>
    `;

    pdfWrapper.innerHTML = html;

    const opt = {
      margin: [8, 8, 8, 8],
      filename: 'Matriz_Consolidada_Resultados_USMP.pdf',
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 2, useCORS: true, letterRendering: true },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' },
      pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
    };

    html2pdf().set(opt).from(pdfWrapper).save().then(() => {
      if (btn) {
        btn.innerHTML = originalHTML;
        btn.disabled = false;
      }
      showToast("¡Descarga Completa!", "La Matriz Consolidada se descargó en PDF exitosamente.", "success");
    }).catch((err) => {
      if (btn) {
        btn.innerHTML = originalHTML;
        btn.disabled = false;
      }
      showToast("Error en PDF", err.toString(), "error");
    });
  }
</script>
